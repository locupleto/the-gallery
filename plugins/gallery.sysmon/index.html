<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>System Monitor</title>
<style>
  :root {
    color-scheme: dark;
    /* Fallbacks for when the bridge's injected CSS variables have not
       landed yet (or the JS bridge failed to load) -- match
       lib/bridge.lua's DEFAULT_THEME for the tokens it defines; --gallery-
       warning has no DEFAULT_THEME counterpart (see lib/theme.lua: warning
       is derived only from a real installed theme's color3), so this is a
       reasonable amber of our own for that one pre-bridge instant. */
    --gallery-background: #1f1811;
    --gallery-foreground: #e8e6df;
    --gallery-accent: #d8a656;
    --gallery-muted: #9a886c;
    --gallery-surface: #2a2214;
    --gallery-danger: #e5726f;
    --gallery-warning: #e0b34d;
    --gallery-success: #5cc98f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--gallery-background);
    color: var(--gallery-foreground);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 12px 16px;
    gap: 8px;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex: 0 0 auto;
  }

  h1 {
    margin: 0;
    font-size: 1.15em;
    font-weight: 600;
    color: var(--gallery-accent);
    letter-spacing: 0.02em;
  }

  #timeLabel {
    font-size: 0.85em;
    color: var(--gallery-muted);
  }

  .badge {
    margin-left: auto;
    font-size: 0.8em;
    padding: 0.15em 0.55em;
    border-radius: 3px;
    background: var(--gallery-warning);
    color: var(--gallery-background);
    font-weight: 600;
  }

  .badge.is-error {
    background: var(--gallery-danger);
  }

  .section-title {
    font-size: 0.75em;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--gallery-muted);
    margin-bottom: 4px;
  }

  .bar {
    display: block;
    width: 100%;
    height: 7px;
    border-radius: 4px;
    background: var(--gallery-surface);
    overflow: hidden;
  }

  .bar-fill {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--gallery-success);
    transition: width 0.4s ease, background-color 0.4s ease;
  }

  #overview {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr) repeat(3, auto);
    gap: 10px 14px;
    align-items: end;
  }

  .tile {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }

  .tile-label {
    font-size: 0.75em;
    color: var(--gallery-muted);
  }

  .tile-value {
    font-size: 0.85em;
    white-space: nowrap;
  }

  .tile.stat-only .tile-value {
    font-size: 0.95em;
    color: var(--gallery-accent);
    font-weight: 600;
  }

  #cores {
    flex: 0 0 auto;
  }

  #coreGrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px 14px;
    max-height: 128px;
    overflow-y: auto;
  }

  .core-row {
    display: grid;
    grid-template-columns: 1.8em 1fr 2.6em;
    align-items: center;
    gap: 5px;
  }

  .core-label {
    font-size: 0.75em;
    color: var(--gallery-muted);
  }

  .core-value {
    font-size: 0.75em;
    text-align: right;
    color: var(--gallery-muted);
  }

  #procs {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  #procTableWrap {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    border: 1px solid var(--gallery-surface);
    border-radius: 4px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    position: sticky;
    top: 0;
    text-align: left;
    font-size: 0.75em;
    color: var(--gallery-muted);
    background: var(--gallery-surface);
    padding: 3px 8px;
    font-weight: 600;
  }

  tbody td {
    padding: 2px 8px;
    font-size: 0.8em;
    white-space: nowrap;
  }

  tbody td.comm {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 1px; /* forces the column to shrink and ellipsize instead of pushing width */
  }

  tbody tr:nth-child(even) {
    background: color-mix(in srgb, var(--gallery-surface) 45%, transparent);
  }

  .proc-empty {
    color: var(--gallery-muted);
    font-style: italic;
  }
</style>
</head>
<body>
  <div id="app">
    <header>
      <h1>System Monitor</h1>
      <span id="timeLabel"></span>
      <span id="staleBadge" class="badge" hidden></span>
    </header>

    <section id="overview">
      <div class="tile">
        <div class="tile-label">CPU</div>
        <span class="bar"><span class="bar-fill" id="cpuOverallFill"></span></span>
        <div class="tile-value" id="cpuOverallValue">subscribing&hellip;</div>
      </div>
      <div class="tile">
        <div class="tile-label">Memory</div>
        <span class="bar"><span class="bar-fill" id="memFill"></span></span>
        <div class="tile-value" id="memValue">subscribing&hellip;</div>
      </div>
      <div class="tile">
        <div class="tile-label">Swap</div>
        <span class="bar"><span class="bar-fill" id="swapFill"></span></span>
        <div class="tile-value" id="swapValue">subscribing&hellip;</div>
      </div>
      <div class="tile stat-only">
        <div class="tile-label">Load avg (1/5/15)</div>
        <div class="tile-value" id="loadValue">&hellip;</div>
      </div>
      <div class="tile stat-only">
        <div class="tile-label">Uptime</div>
        <div class="tile-value" id="uptimeValue">&hellip;</div>
      </div>
      <div class="tile stat-only">
        <div class="tile-label">Tasks / Threads</div>
        <div class="tile-value" id="tasksValue">&hellip;</div>
      </div>
    </section>

    <section id="cores">
      <div class="section-title">Per-core CPU</div>
      <div id="coreGrid" class="core-grid"></div>
    </section>

    <section id="procs">
      <div class="section-title">Top processes</div>
      <div id="procTableWrap">
        <table>
          <thead>
            <tr><th>PID</th><th>CPU%</th><th>MEM%</th><th>COMM</th></tr>
          </thead>
          <tbody id="procBody">
            <tr><td colspan="4" class="proc-empty">subscribing&hellip;</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="Model.js"></script>
  <script>
    (function () {
      var Model = window.SysmonModel;

      var lastRaw = null;
      var lastVm = null;
      var lastUptime = null;
      var lastProcs = [];
      var usingSnapshotProcs = false;

      function el(id) { return document.getElementById(id); }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
        });
      }

      // success/warning/danger thresholds for bar fill colour -- referenced
      // as CSS var() strings (not resolved to a hex value here), so a theme
      // change repaints every bar automatically without any JS re-render.
      function barColorVar(percent) {
        if (percent >= 85) return "var(--gallery-danger)";
        if (percent >= 60) return "var(--gallery-warning)";
        return "var(--gallery-success)";
      }

      function setBar(fillEl, percent) {
        var p = Math.max(0, Math.min(100, Number(percent) || 0));
        fillEl.style.width = p + "%";
        fillEl.style.background = barColorVar(p);
      }

      function renderOverview(vm) {
        setBar(el("cpuOverallFill"), vm.cpuOverall);
        el("cpuOverallValue").textContent = Model.formatPercent(vm.cpuOverall);

        setBar(el("memFill"), vm.mem.percent);
        el("memValue").textContent =
          Model.compactBytes(vm.mem.usedBytes) + " / " + Model.compactBytes(vm.mem.totalBytes) +
          " (" + Model.formatPercent(vm.mem.percent) + ")";

        setBar(el("swapFill"), vm.swap.percent);
        el("swapValue").textContent = vm.swap.totalBytes > 0
          ? Model.compactBytes(vm.swap.usedBytes) + " / " + Model.compactBytes(vm.swap.totalBytes) +
            " (" + Model.formatPercent(vm.swap.percent) + ")"
          : "none";

        el("loadValue").textContent = Model.formatLoad(vm.load);
        el("uptimeValue").textContent = lastUptime || "…";
        el("tasksValue").textContent =
          (vm.tasks != null ? vm.tasks : "?") + " / " + (vm.threads != null ? vm.threads : "?");
      }

      function renderCores(vm) {
        var grid = el("coreGrid");
        if (grid.children.length !== vm.cpuCores.length) {
          grid.innerHTML = "";
          vm.cpuCores.forEach(function (_, i) {
            var row = document.createElement("div");
            row.className = "core-row";
            row.innerHTML =
              '<span class="core-label">C' + i + '</span>' +
              '<span class="bar"><span class="bar-fill"></span></span>' +
              '<span class="core-value"></span>';
            grid.appendChild(row);
          });
        }
        vm.cpuCores.forEach(function (pct, i) {
          var row = grid.children[i];
          if (!row) return;
          setBar(row.querySelector(".bar-fill"), pct);
          row.querySelector(".core-value").textContent = Model.formatPercent(pct);
        });
      }

      function renderStaleBadge(vm) {
        var badge = el("staleBadge");
        badge.classList.remove("is-error");
        if (vm.stale) {
          badge.hidden = false;
          var age = vm.ageSeconds != null ? Math.round(vm.ageSeconds) : "?";
          badge.textContent = "stale snapshot (" + age + "s old)";
        } else {
          badge.hidden = true;
        }
        el("timeLabel").textContent = vm.timeLabel || "";
      }

      function renderErrorBadge(message) {
        var badge = el("staleBadge");
        badge.hidden = false;
        badge.classList.add("is-error");
        badge.textContent = message;
      }

      function renderProcs(rows) {
        var body = el("procBody");
        body.innerHTML = "";
        if (!rows || rows.length === 0) {
          var empty = document.createElement("tr");
          empty.innerHTML = '<td colspan="4" class="proc-empty">no data</td>';
          body.appendChild(empty);
          return;
        }
        rows.forEach(function (p) {
          var tr = document.createElement("tr");
          tr.innerHTML =
            "<td>" + escapeHtml(p.pid) + "</td>" +
            "<td>" + (isFinite(p.cpu) ? p.cpu.toFixed(1) : "?") + "</td>" +
            "<td>" + (isFinite(p.mem) ? p.mem.toFixed(1) : "?") + "</td>" +
            "<td class=\"comm\">" + escapeHtml(p.comm) + "</td>";
          body.appendChild(tr);
        });
      }

      function renderAll() {
        if (!lastVm) return;
        if (!lastVm.ok) {
          renderErrorBadge(lastVm.error || "metrics unavailable");
          return;
        }
        renderOverview(lastVm);
        renderCores(lastVm);
        renderStaleBadge(lastVm);
        renderProcs(lastProcs);
      }

      // ---- metrics subscription --------------------------------------
      function handleMetrics(raw) {
        lastRaw = raw;
        lastVm = Model.parseSnapshot(raw, Date.now());

        // Spec allows the snapshot itself to carry top processes; today's
        // crystal_sampler metrics.json does not (confirmed by reading a
        // live snapshot: only timestamp/time/interval/load/tasks/threads/
        // mem/swap/temps/fans/cpu), so this branch is defensive for a
        // future sampler version rather than exercised today -- the ps
        // exec fallback below is what actually populates the table.
        if (lastVm.ok && Array.isArray(raw.processes) && raw.processes.length > 0) {
          usingSnapshotProcs = true;
          lastProcs = raw.processes.slice(0, 8).map(function (p) {
            return {
              pid: p.pid != null ? p.pid : "?",
              cpu: Number(p.cpu != null ? p.cpu : p["%cpu"]) || 0,
              mem: Number(p.mem != null ? p.mem : p["%mem"]) || 0,
              comm: p.comm || p.name || p.command || "?"
            };
          });
        } else {
          usingSnapshotProcs = false;
        }
        renderAll();
      }

      // Local 1s ticker: re-evaluates staleness even if pushes stop
      // arriving entirely, so a stalled sampler daemon shows a growing
      // "stale" badge instead of a frozen-looking panel.
      setInterval(function () {
        if (lastRaw) {
          lastVm = Model.parseSnapshot(lastRaw, Date.now());
          renderAll();
        }
      }, 1000);

      // ---- ps / uptime exec fallback, every 5s ------------------------
      function pollExecFallback() {
        if (!window.gallery || typeof window.gallery.exec !== "function") return;

        if (!usingSnapshotProcs) {
          window.gallery.exec("/bin/ps", ["-Aro", "pid,%cpu,%mem,comm"]).then(function (r) {
            if (r.code === 0) {
              lastProcs = Model.parseTopProcesses(r.stdout, 8);
              if (!usingSnapshotProcs) renderProcs(lastProcs);
            }
          }).catch(function () { /* leave last known rows in place */ });
        }

        window.gallery.exec("/usr/bin/uptime", []).then(function (r) {
          if (r.code === 0) {
            var up = Model.parseUptime(r.stdout);
            if (up) {
              lastUptime = up;
              el("uptimeValue").textContent = lastUptime;
            }
          }
        }).catch(function () { /* leave last known uptime in place */ });
      }

      // ---- wiring ------------------------------------------------------
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          if (window.gallery && typeof window.gallery.close === "function") {
            window.gallery.close();
          } else {
            try { window.close(); } catch (e) { /* nothing more to do */ }
          }
        }
      });

      // A theme-reload re-injects --gallery-* CSS variables and dispatches
      // this on window (see Gallery.spoon/init.lua's obj:themeReload); bar
      // colours already track the vars live via var(--gallery-*) in their
      // inline style, but re-render anyway so any value formatting that
      // ever depends on theme (none today) stays correct too.
      window.addEventListener("gallery:theme", function () {
        renderAll();
      });

      if (window.gallery && window.gallery.data && typeof window.gallery.data.subscribe === "function") {
        window.gallery.data.subscribe("metrics", handleMetrics);
      } else {
        renderErrorBadge("gallery.data unavailable (bridge not loaded)");
      }

      pollExecFallback();
      setInterval(pollExecFallback, 5000);
    })();
  </script>
</body>
</html>
