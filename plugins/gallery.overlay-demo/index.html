<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Gallery Overlay Demo</title>
<style>
  :root {
    color-scheme: dark;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: rgba(10, 10, 14, 0.72);
    color: #e8e6df;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.6em;
  }

  h1 {
    margin: 0;
    font-size: 2.4em;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: #d8a656;
  }

  p {
    margin: 0;
    font-size: 1.1em;
    color: #b7b4ab;
  }
</style>
</head>
<body>
  <h1>The Gallery</h1>
  <p>press any key</p>
</body>
</html>
