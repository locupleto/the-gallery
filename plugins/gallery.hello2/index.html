<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Gallery</title>
<style>
  :root {
    color-scheme: dark;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1f1811;
    color: #e8e6df;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25em;
    box-sizing: border-box;
    padding: 1.5em;
  }

  h1 {
    margin: 0;
    font-size: 1.4em;
    font-weight: 600;
    color: #56a6d8;
    letter-spacing: 0.02em;
  }

  input {
    width: 80%;
    max-width: 24em;
    font-size: 1em;
    padding: 0.5em 0.75em;
    background: #2a2118;
    color: #e8e6df;
    border: 1px solid #56a6d8;
    border-radius: 4px;
    outline: none;
  }

  input:focus {
    border-color: #68b9e8;
    box-shadow: 0 0 0 2px rgba(86, 166, 216, 0.25);
  }

  #count, #focusState {
    font-size: 0.9em;
    color: #b7b4ab;
  }

  #count strong, #focusState strong {
    color: #56a6d8;
  }
</style>
</head>
<body>
  <h1>The Gallery</h1>
  <input type="text" id="input" autofocus>
  <div id="count">Keypresses: <strong id="counter">0</strong></div>
  <div id="focusState">document.hasFocus(): <strong id="focusValue">?</strong></div>

  <script>
    (function () {
      var input = document.getElementById("input");
      var counter = document.getElementById("counter");
      var focusValue = document.getElementById("focusValue");
      var presses = 0;

      function safeLog(message) {
        if (window.gallery && typeof window.gallery.log === "function") {
          window.gallery.log(message);
        }
      }

      function updateFocusDisplay() {
        focusValue.textContent = document.hasFocus() ? "true" : "false";
      }

      input.focus();
      updateFocusDisplay();
      // window/document "focus"/"blur" events only fire on a state
      // *transition*. If the window is already focused (or not) by the
      // time this script runs, log that initial state explicitly so a
      // panel open is always observable in the log even without an
      // actual focus change afterwards.
      safeLog(document.hasFocus() ? "focus" : "blur");

      window.addEventListener("focus", function () {
        safeLog("focus");
        updateFocusDisplay();
      });

      window.addEventListener("blur", function () {
        safeLog("blur");
        updateFocusDisplay();
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          if (window.gallery && typeof window.gallery.close === "function") {
            window.gallery.close();
          } else {
            // Fallback only, for when the JS-to-Lua bridge failed to load.
            try {
              window.close();
            } catch (e) {
              // ignore -- nothing more we can do
            }
          }
          return;
        }

        presses += 1;
        counter.textContent = String(presses);
        safeLog("keydown count: " + presses);
      });
    })();
  </script>
</body>
</html>
